services:
  - type: web
    name: operameds-api
    runtime: node
    region: ohio
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: operamed
      - key: OPERAMEDS_ALLOWED_ORIGINS
        sync: false
      - key: OPERAMEDS_COOKIE_SAMESITE
        value: "None"
